name: Build and Publish Docker Images

on: 
  push:
    branches: [ "feature/pipelines" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}

    strategy:
      matrix:
        service:
          - name: cicd-runner
            context: hub/CICD_Runner/cicd_runner
            dockerfile: hub/CICD_Runner/cicd_runner/Dockerfile
          - name: reverse-proxy-server
            context: hub/ReverseProxyServer
            dockerfile: hub/ReverseProxyServer/Dockerfile

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Login to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3️⃣ Build and push each service
      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}/${{ matrix.service.context }}
          file: ${{ github.workspace }}/${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/t-hex/${{ matrix.service.name }}:latest
